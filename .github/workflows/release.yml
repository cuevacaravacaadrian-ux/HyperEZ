# Al subir una etiqueta vX.Y.Z: compila con PGO, pasa las pruebas y publica la versión en GitHub
# con el instalador, la extensión de VS Code y hyper.exe.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: La etiqueta coincide con la versión del código
        shell: pwsh
        run: |
          $v = (Select-String -Path src/core/version.h -Pattern 'HYPEREZ_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con la versión $v (usa tools/set_version.py)" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSYS2 (GCC, CMake y Ninja)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Compilar con PGO, probar y empaquetar
        shell: pwsh
        env:
          HYPEREZ_MSYS: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        run: ./build.ps1

      - name: Notas de la versión (del CHANGELOG)
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "HyperEZ $env:VERSION" }
          $notes += "`n`n**Instalar:** descarga ``HyperEZ-Setup-$env:VERSION.exe`` y ejecútalo (no necesita administrador)."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publicar la versión
        uses: softprops/action-gh-release@v2
        with:
          name: HyperEZ ${{ env.VERSION }}
          body_path: release-notes.md
          files: dist/*
