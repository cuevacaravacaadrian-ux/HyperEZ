# La web de HyperEZ (projects/web) en GitHub Pages: https://cuevacaravacaadrian.github.io/HyperEZ/
# Se genera con el propio HyperEZ; el editor usa HyperEZ compilado a WebAssembly con Emscripten.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Construir y probar la web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # las etiquetas, para la página de versiones

      - name: Herramientas
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13 # la misma con la que se prueba en Windows

      - name: HyperEZ (genera la web)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHYPEREZ_LTO=OFF
          cmake --build build --target hyper

      - name: HyperEZ en WebAssembly (el editor)
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web

      - name: Pruebas del módulo WebAssembly y del núcleo del editor
        run: |
          node projects/web/tests/wasm.test.js build-web/hyperez.js
          node projects/web/tests/nucleo.test.js
          node projects/web/tests/aprender.test.js build-web/hyperez.js

      - name: Generar la web
        env: # códigos de Google Search Console y Bing Webmaster Tools (variables del repositorio; opcionales)
          HZ_GOOGLE_VERIFICACION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          HZ_BING_VERIFICACION: ${{ vars.BING_SITE_VERIFICATION }}
          HZ_DOMINIO: ${{ vars.WEB_DOMINIO }}
        run: build/hyper projects/web/construir.hez projects/web/dist --wasm build-web

      - name: Probar el editor en Chrome
        run: |
          build/hyper serve projects/web/dist --puerto 8123 --sin-recarga > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8123/index.html > /dev/null && break; sleep 0.5; done
          node projects/web/tests/navegador.test.js http://localhost:8123/editor/index.html
          node projects/web/tests/aprender-navegador.test.js http://localhost:8123/aprender.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/web/dist

  publicar:
    name: Publicar en GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

      - name: Avisar a los buscadores con IndexNow (Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        env:
          WEB: ${{ steps.despliegue.outputs.page_url }}
          CLAVE: ea7183867bbcf24ffb3bed860715189a
        run: |
          sleep 20
          urls=$(curl -sf "${WEB}sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          host=$(echo "$WEB" | sed -E 's#https?://([^/]+)/.*#\1#')
          jq -nc --arg host "$host" --arg key "$CLAVE" --arg loc "${WEB}${CLAVE}.txt" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}' > indexnow.json
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json
