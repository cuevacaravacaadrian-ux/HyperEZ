# Compila HyperEZ y ejecuta todas las pruebas en Windows, Linux y macOS en cada push y pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 (GCC, CMake y Ninja)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Compilar, probar y empaquetar
        shell: pwsh
        env:
          HYPEREZ_MSYS: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        run: ./build.ps1 -NoPGO

      - name: Guardar el instalador, la extensión y hyper.exe
        uses: actions/upload-artifact@v4
        with:
          name: HyperEZ-windows
          path: dist/*
          if-no-files-found: error

  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ninja-build; else brew install ninja; fi

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Pruebas
        run: ctest --test-dir build --output-on-failure

      - name: Paquete
        run: sh packaging/unix/package.sh build/hyper

      - uses: actions/upload-artifact@v4
        with:
          name: HyperEZ-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  setup-hyperez:
    name: Acción setup-hyperez (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar una versión publicada con la acción del repositorio
        id: hz
        uses: ./actions/setup-hyperez
        with:
          version: "0.8.0"

      - name: hyper está en el PATH
        shell: bash
        run: |
          test "${{ steps.hz.outputs.version }}" = "0.8.0"
          hyper version
          printf 'print("hola desde la acción: ${1 + 1}")\n' > hola.hez
          hyper run hola.hez
